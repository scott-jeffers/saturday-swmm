name: Release

# Push a tag like v0.3.0 (see scripts/bump_version.py) to build the portable
# Windows zip and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_version.py "${{ github.ref_name }}"

      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Build portable zip
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build_portable.ps1

      - name: Release notes from CHANGELOG
        shell: python
        run: |
          import os, re, pathlib
          v = pathlib.Path("VERSION").read_text().strip()
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(v)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          notes = (m.group(1).strip() if m else "") or f"Saturday-SWMM {v}"
          notes += "\n\n**Download** `Saturday-SWMM-" + v + "-win64.zip`, unzip, double-click `Saturday-SWMM.cmd`."
          pathlib.Path("dist/RELEASE_NOTES.md").write_text(notes, encoding="utf-8")

      - uses: actions/upload-artifact@v4
        with:
          name: saturday-swmm-win64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/*.sha256

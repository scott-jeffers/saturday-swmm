name: Release

# Publishing a release = merging a version bump into main
# (python scripts/bump_version.py X.Y.Z, fill in CHANGELOG.md, merge).
#
# - push to main that changes VERSION, and no tag vX.Y.Z exists yet:
#     build, then publish release vX.Y.Z (the tag is created on that commit)
# - push of a tag v*:      build and publish that tag (manual route, still works)
# - Run workflow (manual): build only; the zip is kept as a run artifact
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.p.outputs.version }}
      build: ${{ steps.p.outputs.build }}
      publish: ${{ steps.p.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        shell: bash
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          exists=$(git ls-remote --tags origin "refs/tags/v$v" | wc -l)
          build=true; publish=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            publish=true
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$exists" -gt 0 ]; then
              echo "::notice::v$v is already released; nothing to do."
              build=false
            else
              publish=true
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$v build=$build publish=$publish (tag exists: $exists)"

  windows-portable:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version numbers agree
        run: python scripts/check_version.py "v${{ needs.plan.outputs.version }}"

      - name: Changelog has an entry for this version
        if: needs.plan.outputs.publish == 'true'
        shell: python
        run: |
          import pathlib, re, sys
          v = "${{ needs.plan.outputs.version }}"
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(v)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          body = (m.group(1) if m else "").strip()
          if not body or body == "-":
              sys.exit(f"CHANGELOG.md has no notes for {v}: add them under '## [{v}]'.")

      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Build portable zip
        run: powershell -ExecutionPolicy Bypass -File packaging/windows/build_portable.ps1

      - name: Release notes from CHANGELOG
        shell: python
        run: |
          import re, pathlib
          v = "${{ needs.plan.outputs.version }}"
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"^## \[{re.escape(v)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          notes = (m.group(1).strip() if m else "") or f"Saturday-SWMM {v}"
          notes += "\n\n**Download** `Saturday-SWMM-" + v + "-win64.zip`, unzip, double-click `Saturday-SWMM.cmd`."
          pathlib.Path("dist/RELEASE_NOTES.md").write_text(notes, encoding="utf-8")

      - uses: actions/upload-artifact@v4
        with:
          name: saturday-swmm-win64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Publish GitHub release
        if: needs.plan.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Saturday-SWMM ${{ needs.plan.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          prerelease: ${{ contains(needs.plan.outputs.version, '-') }}
          files: |
            dist/*.zip
            dist/*.sha256

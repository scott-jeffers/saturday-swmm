name: Renumber v1.x releases to 0.x alpha

# One-off, run by hand from the Actions tab. Saturday-SWMM is still alpha, but
# releases v1.0.0 to v1.3.1 were numbered as if it were 1.0. This renames each
# release, its tag and its download files to the 0.x number it should have had:
#   1.0.0 -> 0.10.0, 1.1.0 -> 0.11.0, 1.2.0 -> 0.12.0, 1.2.1 -> 0.12.1,
#   1.2.2 -> 0.12.2, 1.3.0 -> 0.13.0, 1.3.1 -> 0.13.1
# Tags created with GITHUB_TOKEN do not trigger other workflows, so nothing is
# rebuilt or republished. Safe to re-run: finished releases are skipped.
# The zips inside keep their original build; only names change.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RENUMBER to rename the seven v1.x releases
        required: true

permissions:
  contents: write

jobs:
  renumber:
    if: inputs.confirm == 'RENUMBER'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - name: Rename releases, tags and assets
        shell: bash
        run: |
          set -euo pipefail
          while read -r old new; do
            if gh api "repos/$R/releases/tags/v$new" >/dev/null 2>&1; then
              echo "v$new already exists; skipping $old"; continue
            fi
            id=$(gh api "repos/$R/releases/tags/v$old" --jq .id)
            sha=$(gh api "repos/$R/git/ref/tags/v$old" --jq .object.sha)
            # annotated tags point at a tag object; resolve to the commit
            if [ "$(gh api "repos/$R/git/ref/tags/v$old" --jq .object.type)" = "tag" ]; then
              sha=$(gh api "repos/$R/git/tags/$sha" --jq .object.sha)
            fi
            gh api -X POST "repos/$R/git/refs" -f ref="refs/tags/v$new" -f sha="$sha" >/dev/null
            body=$(gh api "repos/$R/releases/$id" --jq .body | sed -E \
              -e 's/v?1\.3\.1/0.13.1/g' -e 's/v?1\.3\.0/0.13.0/g' -e 's/v?1\.2\.2/0.12.2/g' \
              -e 's/v?1\.2\.1/0.12.1/g' -e 's/v?1\.2\.0/0.12.0/g' -e 's/v?1\.1\.0/0.11.0/g' -e 's/v?1\.0\.0/0.10.0/g')
            gh api -X PATCH "repos/$R/releases/$id" -f tag_name="v$new" \
              -f name="Saturday-SWMM $new (alpha)" -f body="$body" >/dev/null
            for aid in $(gh api "repos/$R/releases/$id/assets" --jq '.[].id'); do
              an=$(gh api "repos/$R/releases/assets/$aid" --jq .name)
              gh api -X PATCH "repos/$R/releases/assets/$aid" -f name="${an//$old/$new}" >/dev/null
            done
            gh api -X DELETE "repos/$R/git/refs/tags/v$old"
            echo "v$old -> v$new"
          done <<'MAP'
          1.0.0 0.10.0
          1.1.0 0.11.0
          1.2.0 0.12.0
          1.2.1 0.12.1
          1.2.2 0.12.2
          1.3.0 0.13.0
          1.3.1 0.13.1
          MAP
          echo "Releases now:"; gh api "repos/$R/releases" --jq '.[].tag_name' | head -20

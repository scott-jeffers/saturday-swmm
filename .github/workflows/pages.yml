name: Website

# Publishes site/ to GitHub Pages (https://saturday-swmm.com) whenever it
# changes on main, with the browser viewer built from frontend/ at /viewer/.
# Repository setting required once:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
on:
  push:
    branches: [main]
    paths: ["site/**", "frontend/**", "VERSION", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the Bellinge example for the viewer
        run: |
          python -m pip install --quiet "pyswmm>=1.5.0"
          python scripts/build_viewer_example.py frontend/public/examples
      - name: Build the browser viewer
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx vitest run src/viewer
          npm run build:viewer
          rm -rf dist-viewer/audio
          cp -r dist-viewer ../site/viewer
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

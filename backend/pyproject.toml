[project]
name = "saturday-swmm-backend"
version = "0.52.2"
description = "Local FastAPI backend for Saturday-SWMM"
requires-python = ">=3.10"
dependencies = [
    "openswmm>=6.0.0a2",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rasterio>=1.3.0",
    "pyogrio>=0.9.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "pillow>=10.0.0",
    "geopandas>=1.0.0",
    "packaging>=23.0",
    "h5py>=3.10.0",
    "numpy>=1.24.0",
    "pyswmm>=1.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
